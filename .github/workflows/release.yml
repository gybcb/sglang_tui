name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux cross-compiles through zig as the linker, pinning a low
          # glibc floor (2.28) instead of the runner's, so one x86_64 runner
          # emits both gnu binaries that also run on older distros.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            zig_target: x86_64-unknown-linux-gnu.2.28
            native: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            zig_target: aarch64-unknown-linux-gnu.2.28
            native: false
          - target: aarch64-apple-darwin
            runner: macos-14
            native: true
          - target: x86_64-apple-darwin
            runner: macos-14
            native: false
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install zig
        if: runner.os == 'Linux'
        uses: goto-bus-stop/setup-zig@v2.2.1

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild@0.23.4

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.zig_target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sgtop"
          test -x "$bin"
          # A cross-compiled binary cannot exec on the build host, so
          # smoke-test only when the target matches the runner arch.
          if [ "${{ matrix.native }}" = "true" ]; then
            "$bin" --version
          fi
          tar -czf "sgtop-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" sgtop

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: sgtop-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -1
          sha256sum sgtop-*.tar.gz > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
