[package]
name = "sgtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "btop-style TUI monitor for an SGLang inference server"
license = "MIT"

[[bin]]
name = "sgtop"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
unicode-width = "0.2"
anyhow = "1"
dirs = "6"
toml = "1"
mimalloc = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
